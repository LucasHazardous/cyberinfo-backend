name: Test with jest
on:
  push:
    branches:
      - main

jobs:
  test-with-jest:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Node setup
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        uses: npm ci

      - name: Run tests
        uses: npm test